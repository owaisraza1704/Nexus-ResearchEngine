services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      NEXUS_ENVIRONMENT: development
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@postgres:5432/nexus
      NEXUS_ARTIFACT_STORE_PATH: /app/.data/artifacts
    ports:
      - "8000:8000"
    volumes:
      - artifact_data:/app/.data/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  artifact_data:
