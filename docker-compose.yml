services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      NEXUS_ENVIRONMENT: development
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@postgres:5432/nexus
      NEXUS_ARTIFACT_STORE_PATH: /app/.data/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifact_data:/app/.data/artifacts
      - docling_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["procrastinate", "--app", "app.worker.worker", "worker"]
    env_file:
      - .env
    environment:
      NEXUS_ENVIRONMENT: development
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@postgres:5432/nexus
      NEXUS_ARTIFACT_STORE_PATH: /app/.data/artifacts
    volumes:
      - artifact_data:/app/.data/artifacts
      - docling_model_cache:/root/.cache/huggingface
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy

  ui:
    build:
      context: ./NexusUI
      args:
        NEXUS_API_URL: http://api:8000
    environment:
      NEXUS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  artifact_data:
  docling_model_cache:
