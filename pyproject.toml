[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-research-engine"
version = "0.1.0"
description = "A source-grounded research engine."
requires-python = ">=3.11"
dependencies = [
    "celery[redis]==5.6.3",
    "alembic>=1.13,<2",
    "docling>=2.129,<3",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
    "openai>=1,<2",
    "python-dotenv>=1,<2",
    "pgvector>=0.3,<1",
    "procrastinate==3.10.0", # Historical migration 0009 only, not the runtime worker.
    "networkx>=3.4,<3.7",
    "httpx>=0.28,<1",
    "safehttpx==0.1.7",
    "trafilatura>=2.2,<3",
    "tiktoken>=0.8,<1",
    "ranx==0.3.21",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "ir-measures>=0.4,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "python-docx>=1,<2",
    "reportlab>=4,<5",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Docling runs on CPU in the local Linux container; avoid CUDA runtime downloads.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
